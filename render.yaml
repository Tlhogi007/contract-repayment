# Render Blueprint — Docker web service + disk for SQLite.
# Dashboard: New → Blueprint → this repo. Reviewers do not need Docker locally.
services:
  - type: web
    name: contract-repayment-api
    runtime: docker
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: DATABASE_URL
        value: file:/data/prod.db
      - key: OTEL_SERVICE_NAME
        value: contract-repayment-api
    disk:
      name: api-data
      mountPath: /data
      sizeGB: 1
