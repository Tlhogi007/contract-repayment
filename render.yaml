# Render Blueprint — Docker API + Static Vite UI (independent deploys).
# Dashboard: New → Blueprint → this repo. Reviewers do not need Docker locally.
services:
  - type: web
    name: contract-repayment-api
    runtime: docker
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: DATABASE_URL
        value: file:/data/prod.db
      - key: OTEL_SERVICE_NAME
        value: contract-repayment-api
      - key: CORS_ORIGINS
        fromService:
          name: contract-repayment-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    disk:
      name: api-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: contract-repayment-web
    runtime: static
    buildCommand: npm ci --prefix web && npm run build --prefix web
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: contract-repayment-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
