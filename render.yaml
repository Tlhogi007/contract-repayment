# Legacy Render Blueprint (API now primary on Fly.io — see fly.toml).
# UI: https://github.com/Tlhogi007/contract-repayment-web (Vercel).
# Both services share one Render workspace; CORS_ORIGINS comes from the static site URL.
services:
  - type: web
    name: contract-repayment-api
    runtime: docker
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: DATABASE_URL
        value: file:/data/prod.db
      - key: OTEL_SERVICE_NAME
        value: contract-repayment-api
      - key: CORS_ORIGINS
        fromService:
          name: contract-repayment-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    disk:
      name: api-data
      mountPath: /data
      sizeGB: 1
