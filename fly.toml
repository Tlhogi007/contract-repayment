# Fly.io — Nest API (always-on). UI stays on Vercel.
# https://fly.io/docs/reference/configuration/

app = 'contract-repayment-api'
primary_region = 'jnb'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  DATABASE_URL = 'file:/data/prod.db'
  JWT_EXPIRES_IN = '1h'
  OTEL_SERVICE_NAME = 'contract-repayment-api'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health/ready'

[[mounts]]
  source = 'api_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
